[package]
name = "forge-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "A secure incremental mirror for forge issue and review metadata"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
